name: ci

on:
  push:
    paths:
      - '**'
      - '!*.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/PULL_REQUEST_TEMPLATE*'
      - '!.github/FUNDING.yml'
      - '!.github/CODEOWNERS'
      - '!.editorconfig'
      - '!docs/**'
      - 'docs/EFFECTS.md'
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

# A push runs the quality checks and the test suite. Everything that renders
# the catalog on the CPU (the catalog smoke tests, the cross-port spine and the
# Windows rendered parity) runs weekly and on manual dispatch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && 'gate' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.85.0 --profile minimal

      - name: Verify formatting
        run: cargo +stable fmt --all -- --check

      - name: Lint all targets
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

      - name: Check the minimum supported Rust version
        run: cargo +1.85.0 check --all-targets --all-features

      - name: Test the generator
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify generated artifacts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/generate_bundle.py --check

  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test all targets
        run: cargo +stable test --all-targets --all-features --locked

      - name: Build the release binary
        run: cargo +stable build --release --locked

      - name: Build the crate archive
        run: cargo +stable package --locked

  parity-windows:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned JavaScript CPU oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: 8ae8e2ae97812952db49246a87b04d7e5a480494
          path: oracle
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build release CLI
        run: cargo +stable build --release --locked --bin noisemaker-rs

      - name: Compare rendered catalog against pinned oracle
        run: python scripts/parity.py --rust "$env:GITHUB_WORKSPACE/target/release/noisemaker-rs.exe" --js "$env:GITHUB_WORKSPACE/oracle/bin/noisemaker-cpu.js" --timeout 120 --json parity-report-windows.json

      - name: Retain Windows parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: rust-windows-parity-${{ github.sha }}
          path: parity-report-windows.json
          if-no-files-found: warn

  catalog-smoke:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned JavaScript CPU oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: 8ae8e2ae97812952db49246a87b04d7e5a480494
          path: oracle
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Catalog smoke and cross-port spine tests
        env:
          NOISEMAKER_JS_CPU_DIR: ${{ github.workspace }}/oracle
        run: >-
          cargo +stable test --release --all-features --locked
          --test catalog_smoke --test parity_spine -- --include-ignored
