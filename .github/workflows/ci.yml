name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt clippy
          rustup toolchain install 1.85.0 --profile minimal

      - name: Verify formatting
        run: cargo +stable fmt --all -- --check

      - name: Lint all targets
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

      - name: Check the minimum supported Rust version
        run: cargo +1.85.0 check --all-targets --all-features

      - name: Test the generator
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify generated artifacts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/generate_bundle.py --check

  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test all targets
        run: cargo +stable test --all-targets --all-features --locked

      - name: Build the release binary
        run: cargo +stable build --release --locked

      - name: Build the crate archive
        run: cargo +stable package --locked
