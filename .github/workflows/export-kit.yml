name: Export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.

# The kit releases only after the rendered cross-port parity against the pinned
# JavaScript CPU oracle passes. That parity renders the catalog on the CPU, so it
# runs weekly and on manual dispatch rather than on push (ci.yml gates pushes).
on:
  workflow_dispatch:
  schedule:
    - cron: '53 8 * * 1'

permissions: {}

concurrency:
  group: export-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rendered-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Rust source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned JavaScript CPU oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: 8ae8e2ae97812952db49246a87b04d7e5a480494
          path: oracle
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build parity CLI
        run: cargo +stable build --release --locked --bin noisemaker-rs

      - name: Compare rendered catalog against pinned oracle
        run: python3 scripts/parity.py --rust "$GITHUB_WORKSPACE/target/release/noisemaker-rs" --js "$GITHUB_WORKSPACE/oracle/bin/noisemaker-cpu.js" --timeout 120 --json parity-report.json

      - name: Retain parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: rust-rendered-parity-${{ github.sha }}
          path: parity-report.json
          if-no-files-found: warn

  dispatch:
    if: github.ref == 'refs/heads/main'
    needs: rendered-parity
    runs-on: ubuntu-latest
    steps:
      # scaffold mints a new kit version for every dispatch, so a weekly run on
      # an unchanged main must not release the same SHA again.
      - name: Skip a SHA that is already released
        id: released
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/kit-*')
          if printf '%s\n' "$tags" | awk '$2 ~ /\^\{\}$/ { print $1 }' | grep -qx "$SHA"; then
            echo "$SHA already carries a kit tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint scaffold-dispatch token
        if: steps.released.outputs.released == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=rust \
            -f sha=${{ github.sha }}
